name: Daily security radar
on:
  schedule:
    - cron: '7,37 1 * * *'
    - cron: '7 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/daily.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: security-radar
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Collect public intelligence
        if: github.event_name != 'push'
        id: collect
        continue-on-error: true
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: npm run collect
      - name: Save report and collection status
        if: always() && github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily security report'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Mark collection failure
        if: steps.collect.outcome == 'failure'
        run: echo 'Collection failed. Previous report preserved; status page will show the failure.'
    outputs:
      collection: ${{ steps.collect.outcome }}
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report collection failure after publishing status
        if: needs.update.outputs.collection == 'failure'
        run: exit 1
